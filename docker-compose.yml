services:
  trimbin:
    build: .
    container_name: trimbin
    restart: unless-stopped
    ports:
      - "${PORT:-5380}:5380"
    volumes:
      - trimbin_data:/data
      # Mount your media libraries so Trimbin can scan them and trim files.
      # The in-container paths MUST match the paths you set in MEDIA_LIBRARIES.
      # Read-write is needed for trim/delete; use :ro if you only want scans.
      # Example — edit to match your setup:
      # - /srv/media:/media
      # For the Orphans tab, also mount your qBittorrent download root at the
      # path you set in QBIT_DOWNLOAD_ROOT (read-write, so orphans can be deleted):
      # - /srv/downloads:/downloads
    env_file:
      - .env

volumes:
  trimbin_data:
